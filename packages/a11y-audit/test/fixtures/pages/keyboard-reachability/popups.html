<!doctype html>
<!--
  keyboard-reachability-check: popups (opened with ArrowDown, one level)
  - #fruit: role=combobox with aria-controls; ArrowDown opens #fruit-list and
    moves aria-activedescendant through its options → options 'activedescendant',
    foundIn 'popup', popup status 'explored'.
  - #actions: aria-haspopup="true" menu button WITHOUT aria-controls; its menu
    is rendered at the end of <body> (portal). ArrowDown opens it and focuses
    the first item; roving ArrowDown/ArrowUp → items 'arrow'. A focusable
    aria-disabled item (APG style) sits before the last item: it is not
    counted, but focus landing on it must not end the exploration.
  - #broken: menu button whose roving skips "#broken-skipped"
    → popup-item-not-reached / medium.
  - #hint: aria-haspopup="true" button whose ArrowDown shows role=menuitem
    elements but never moves focus → 'opened-not-entered', items not judged.
  - #dialog-trigger: aria-haspopup="dialog" → not a popup trigger at all.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Keyboard reachability: popups</title>
  </head>
  <body>
    <h1>Keyboard reachability: popups</h1>

    <label for="fruit">Fruit</label>
    <input
      id="fruit"
      type="text"
      role="combobox"
      aria-controls="fruit-list"
      aria-expanded="false"
      aria-autocomplete="list"
    />
    <ul id="fruit-list" role="listbox" aria-label="Fruits" hidden>
      <li role="option" id="fruit-apple">Apple</li>
      <li role="option" id="fruit-banana">Banana</li>
      <li role="option" id="fruit-cherry">Cherry</li>
    </ul>

    <button
      type="button"
      id="actions"
      aria-haspopup="true"
      aria-expanded="false"
    >
      Actions
    </button>

    <button
      type="button"
      id="broken"
      aria-haspopup="menu"
      aria-expanded="false"
    >
      Broken
    </button>

    <button type="button" id="hint" aria-haspopup="true" aria-expanded="false">
      Hint
    </button>
    <div id="hint-popup" hidden>
      <div role="menuitem" id="hint-item">Shown but never focused</div>
    </div>

    <button type="button" id="dialog-trigger" aria-haspopup="dialog">
      Open dialog
    </button>

    <!-- "portal": menus rendered at the end of body, no aria-controls -->
    <div role="menu" id="actions-menu" aria-label="Actions" hidden>
      <div role="menuitem" id="act-copy" tabindex="-1">Copy</div>
      <div role="menuitem" id="act-paste" tabindex="-1">Paste</div>
      <!-- APG: disabled menu items stay focusable; exploration must go on -->
      <div role="menuitem" id="act-export" tabindex="-1" aria-disabled="true">
        Export
      </div>
      <div role="menuitem" id="act-delete" tabindex="-1">Delete</div>
    </div>
    <div role="menu" id="broken-menu" aria-label="Broken" hidden>
      <div role="menuitem" id="broken-one" tabindex="-1">One</div>
      <div role="menuitem" id="broken-two" tabindex="-1">Two</div>
      <div role="menuitem" id="broken-skipped" tabindex="-1">Skipped</div>
    </div>

    <script>
      // Combobox (activedescendant)
      const input = document.getElementById('fruit');
      const list = document.getElementById('fruit-list');
      const options = [...list.querySelectorAll('[role="option"]')];
      let active = -1;
      function setActive(i) {
        active = i;
        if (i < 0) input.removeAttribute('aria-activedescendant');
        else input.setAttribute('aria-activedescendant', options[i].id);
      }
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (list.hidden) {
            list.hidden = false;
            input.setAttribute('aria-expanded', 'true');
            setActive(0);
          } else setActive(Math.min(active + 1, options.length - 1));
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (!list.hidden) setActive(Math.max(active - 1, 0));
        } else if (e.key === 'Escape') {
          list.hidden = true;
          input.setAttribute('aria-expanded', 'false');
          setActive(-1);
        }
      });

      // Menu buttons (roving focus, portal menus)
      function menuButton(button, menu, items) {
        function close() {
          menu.hidden = true;
          button.setAttribute('aria-expanded', 'false');
          button.focus();
        }
        button.addEventListener('keydown', (e) => {
          if (e.key !== 'ArrowDown') return;
          e.preventDefault();
          menu.hidden = false;
          button.setAttribute('aria-expanded', 'true');
          items[0].focus();
        });
        menu.addEventListener('keydown', (e) => {
          const i = items.indexOf(document.activeElement);
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            items[Math.min(i + 1, items.length - 1)].focus();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            items[Math.max(i - 1, 0)].focus();
          } else if (e.key === 'Escape') {
            close();
          }
        });
      }
      const actionsMenu = document.getElementById('actions-menu');
      menuButton(document.getElementById('actions'), actionsMenu, [
        ...actionsMenu.querySelectorAll('[role="menuitem"]'),
      ]);
      // Broken: the roving list leaves out the last item.
      menuButton(
        document.getElementById('broken'),
        document.getElementById('broken-menu'),
        [
          document.getElementById('broken-one'),
          document.getElementById('broken-two'),
        ],
      );

      // Hint: shows menuitems on ArrowDown but keeps focus on the button.
      const hint = document.getElementById('hint');
      hint.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          document.getElementById('hint-popup').hidden = false;
          hint.setAttribute('aria-expanded', 'true');
        } else if (e.key === 'Escape') {
          document.getElementById('hint-popup').hidden = true;
          hint.setAttribute('aria-expanded', 'false');
        }
      });
    </script>
  </body>
</html>
