<!doctype html>
<!--
  A masked verification code: type=password with autocomplete="one-time-code".
  Expected: kind "one-time-code" and autocompleteStatus "ok".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Masked OTP</title>
  </head>
  <body>
    <form>
      <label>Code <input type="password" autocomplete="one-time-code" /></label>
    </form>
  </body>
</html>
