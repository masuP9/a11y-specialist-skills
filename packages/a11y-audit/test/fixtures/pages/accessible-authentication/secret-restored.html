<!doctype html>
<!--
  The password field has a real initial value and the page restores it when a
  paste is attempted (a controlled input that refuses pasting). A second form
  whose id contains "captcha" also holds a password with a secret value.
  Expected: paste.result "blocked", valueAfterPaste "other"; the whole result
  JSON contains neither secret; the field value is back to the first secret
  after the check; captchas has exactly 1 entry (the form).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secret restored</title>
  </head>
  <body>
    <form>
      <input
        type="password"
        id="pw"
        autocomplete="current-password"
        value="S3cret-Leak-Canary"
      />
    </form>
    <form id="captcha-login">
      <input
        type="password"
        autocomplete="current-password"
        value="S3cret-Leak-Canary-2"
      />
    </form>
    <script>
      var pw = document.getElementById('pw');
      pw.addEventListener('input', function (event) {
        if (event.inputType === 'insertFromPaste') {
          pw.value = 'S3cret-Leak-Canary';
        }
      });
    </script>
  </body>
</html>
