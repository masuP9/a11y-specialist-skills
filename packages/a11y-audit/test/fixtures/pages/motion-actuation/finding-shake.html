<!doctype html>
<!--
  Shake to undo: a devicemotion listener on window undoes the last action when
  the acceleration swings past 15 in opposite directions. An "Undo" button
  exists too.
  Expected: a11y-skills/motion-actuation is incomplete, one window listener,
  simulation.results[0].domMutations > 0.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shake to undo</title>
  </head>
  <body>
    <p id="status">Item added</p>
    <button id="undo" type="button">Undo</button>
    <script>
      let previousX = 0;
      let undone = 0;
      function undo() {
        undone += 1;
        document.getElementById('status').textContent = 'Undone x' + undone;
      }
      document.getElementById('undo').addEventListener('click', undo);
      window.addEventListener('devicemotion', function (event) {
        const x = event.accelerationIncludingGravity.x;
        if (x * previousX < 0 && Math.abs(x) > 15) undo();
        previousX = x;
      });
    </script>
  </body>
</html>
