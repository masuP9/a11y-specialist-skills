<!doctype html>
<!--
  The devicemotion listener reloads the page.
  Expected: no exception; navigated true with urlAfter equal to this page's URL;
  the summary says the page reloaded or was replaced, not "navigation to".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reloads on motion</title>
  </head>
  <body>
    <p>Shake to reload</p>
    <script>
      window.addEventListener('devicemotion', function (event) {
        // Desktop Chromium fires one devicemotion with null values when the
        // listener is added; only react to events that carry data.
        if (event.accelerationIncludingGravity?.x == null) return;
        location.reload();
      });
    </script>
  </body>
</html>
