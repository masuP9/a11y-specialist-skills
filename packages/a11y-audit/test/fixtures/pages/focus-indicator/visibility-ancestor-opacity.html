<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      focus-indicator visibility: button inside a transparent wrapper
    </title>
    <style>
      :focus {
        outline: 3px solid #005fcc;
      }
      .wrapper {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class="wrapper"><button id="hidden-button">Hidden</button></div>
  </body>
</html>
