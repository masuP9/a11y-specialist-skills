<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      focus-indicator visibility: section revealed by an IntersectionObserver
      after focus scrolls to it
    </title>
    <style>
      :focus {
        outline: 3px solid #005fcc;
      }
      .spacer {
        height: 150vh;
      }
      .section {
        height: 200px;
        opacity: 0;
      }
      .section.shown {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <button id="first">First</button>
    <div class="spacer"></div>
    <div class="section" id="section">
      <a id="more" href="#more">Read more</a>
    </div>
    <script>
      const section = document.getElementById('section');
      new IntersectionObserver((entries) => {
        for (const entry of entries) {
          section.classList.toggle('shown', entry.isIntersecting);
        }
      }).observe(section);
    </script>
  </body>
</html>
