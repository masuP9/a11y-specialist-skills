<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      focus-indicator visibility: link outside a clipping nav under a fixed,
      translated header
    </title>
    <style>
      :focus {
        outline: 3px solid #005fcc;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        transform: translate(0, 0);
      }
      nav {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 86px;
        /* clip, unlike hidden, is not scrolled to reveal the focused link */
        overflow: clip;
      }
      nav ul {
        margin: 0;
        padding-top: 100px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a id="menu-link" href="#products">Products</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
