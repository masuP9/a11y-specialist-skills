<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: autofocus before the first Tab</title>
    <style>
      :focus {
        outline: 3px solid #005fcc;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <button id="auto" autofocus>Focused by autofocus</button>
    <button id="next">Focused by Tab</button>
  </body>
</html>
