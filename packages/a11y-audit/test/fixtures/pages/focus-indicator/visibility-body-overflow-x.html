<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      focus-indicator visibility: off-screen link under a body with overflow-x
      hidden
    </title>
    <style>
      :focus {
        outline: 3px solid #005fcc;
      }
      body {
        overflow-x: hidden;
      }
      .offscreen {
        position: absolute;
        left: -9999px;
      }
    </style>
  </head>
  <body>
    <a id="offscreen" class="offscreen" href="#main">Hidden link</a>
    <main id="main"><p>Content</p></main>
  </body>
</html>
