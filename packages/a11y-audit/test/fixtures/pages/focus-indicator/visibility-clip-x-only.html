<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      focus-indicator visibility: button below a box that clips only
      horizontally
    </title>
    <style>
      :focus {
        outline: 3px solid #005fcc;
      }
      .box {
        margin-top: 50px;
        height: 50px;
        overflow-x: clip;
        overflow-y: visible;
      }
      .spacer {
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spacer"></div>
      <button id="below">Below</button>
    </div>
  </body>
</html>
