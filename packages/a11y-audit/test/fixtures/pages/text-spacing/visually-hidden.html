<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>text-spacing visually-hidden fixture</title>
    <style>
      body {
        margin: 1rem;
        font-size: 16px;
        line-height: 1.5;
      }
      /* Keeps the rule applicable (totalElementsChecked > 0) without clipping. */
      .roomy-box {
        width: 600px;
        height: 200px;
        overflow: hidden;
        padding: 1rem;
      }
      /*
       * Text hidden from sighted users on purpose. It is already fully clipped
       * before the spacing overrides, so 1.4.12 does not apply to it.
       */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .clip-only {
        position: absolute;
        width: 40px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .clip-path-only {
        width: 40px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .tiny-box {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        white-space: nowrap;
      }
      .tiny-box > span {
        display: block;
        width: 40px;
        overflow: hidden;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1>Text Spacing — Visually Hidden</h1>
    <div class="roomy-box">OK</div>
    <table>
      <thead>
        <tr>
          <th scope="col"><span class="visually-hidden">Select</span></th>
          <th scope="col">Name</th>
        </tr>
      </thead>
    </table>
    <span class="clip-only">Hidden with clip rect only</span>
    <div class="clip-path-only">Hidden with clip-path inset only</div>
    <div class="tiny-box">
      <span>Clipped child inside a 1px by 1px box</span>
    </div>
  </body>
</html>
