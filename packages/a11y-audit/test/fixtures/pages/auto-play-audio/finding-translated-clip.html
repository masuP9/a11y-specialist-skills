<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      auto-play-audio finding: controls cut off under a translated ancestor
    </title>
    <script src="tone.js"></script>
  </head>
  <body>
    <h1>Clipped audio player</h1>
    <!--
      The audio lies outside the overflow:hidden box, whose ancestor only
      moves with translate(). The position can still be told, so the controls
      are hidden. Expected: auto-play-audio (incomplete).
    -->
    <div style="transform: translate(10px, 5px)">
      <div style="height: 20px; overflow: hidden">
        <div style="height: 100px"></div>
        <audio id="bgm" autoplay controls></audio>
      </div>
    </div>
    <script>
      document.getElementById('bgm').src = toneUrl();
    </script>
  </body>
</html>
