<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>target-size spacing geometry cases</title>
    <style>
      /*
       * Every target is absolutely positioned so the spacing geometry is
       * deterministic. Coordinates are document CSS px.
       */
      body {
        margin: 0;
        font-family: sans-serif;
        min-height: 2200px;
      }
      .t {
        position: absolute;
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        margin: 0;
        background: #cde;
        font-size: 10px;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Touching circles: 20×20 at x=20 and x=44 → centers 24px apart → OK -->
    <button id="pair-ok-a" class="t" style="left: 20px; top: 20px">a</button>
    <button id="pair-ok-b" class="t" style="left: 44px; top: 20px">b</button>

    <!-- Intersecting circles: 20×20 at x=20 and x=42 → centers 22px apart -->
    <button id="pair-fail-a" class="t" style="left: 20px; top: 100px">a</button>
    <button id="pair-fail-b" class="t" style="left: 42px; top: 100px">b</button>

    <!-- Circle vs a large neighbor: center (30,190) to the neighbor's left edge at x=41 → 11px < 12px -->
    <button id="near-large" class="t" style="left: 20px; top: 180px">s</button>
    <button
      id="large"
      class="t"
      style="left: 41px; top: 170px; width: 100px; height: 40px"
    >
      large
    </button>

    <!-- Nested targets are separate targets: the inner button's circle sits inside the wrapping link -->
    <a id="wrap" class="t" href="#wrap" style="left: 20px; top: 260px">
      <button id="inner" class="t" style="left: 0; top: 0">x</button>
    </a>

    <!-- Card link wrapping a small button: the button must not get a spacing exception -->
    <a
      id="card"
      class="t"
      href="#card"
      style="left: 100px; top: 250px; width: 120px; height: 60px"
    >
      <button id="card-fav" class="t" style="left: 90px; top: 30px">♥</button>
    </a>

    <!-- Label and its control (checkbox is 10px away, would intersect otherwise) -->
    <label id="lbl" for="chk" class="t" style="left: 20px; top: 340px">L</label>
    <input
      id="chk"
      type="checkbox"
      class="t"
      style="left: 40px; top: 343px; width: 13px; height: 13px"
    />

    <!-- Covered target (under an overlay) must not count as a neighbor -->
    <button id="covered" class="t" style="left: 20px; top: 420px">c</button>
    <div
      id="cover"
      style="
        position: absolute;
        left: 0;
        top: 400px;
        width: 200px;
        height: 45px;
        background: rgba(0, 0, 0, 0.3);
      "
    ></div>
    <button id="beside" class="t" style="left: 20px; top: 442px">d</button>

    <!-- Wrapped link: the bounding box covers the button, the line boxes do not -->
    <div
      style="
        position: absolute;
        left: 300px;
        top: 20px;
        width: 300px;
        font-size: 16px;
        line-height: 20px;
      "
    >
      <a id="wrapped" href="#wrapped"
        >first line of the link is quite long<br />x</a
      >
      <button id="near-wrapped" class="t" style="left: 100px; top: 34px">
        n
      </button>
    </div>

    <!-- Vertical pair straddling y=500: with the page scrolled to 500, #stack-a
         is above the viewport but must still count as #stack-b's neighbor -->
    <button id="stack-a" class="t" style="left: 300px; top: 476px">a</button>
    <button id="stack-b" class="t" style="left: 300px; top: 498px">b</button>

    <!-- Implicit label (no `for`) wrapping a checkbox: the label's whole box is a
         target, 11px from the small button's center -->
    <label
      id="implicit"
      class="t"
      style="left: 20px; top: 560px; width: 60px; height: 20px; font-size: 10px"
    >
      <input
        id="implicit-input"
        type="checkbox"
        style="
          width: 13px;
          height: 13px;
          margin: 3px 0 0 0;
          vertical-align: top;
        "
      />
      opt
    </label>
    <button id="near-implicit" class="t" style="left: 81px; top: 560px">
      n
    </button>

    <!-- Two labels for one control: same target, must not intersect each other -->
    <label id="dual-a" for="dual" class="t" style="left: 20px; top: 620px"
      >A</label
    >
    <label id="dual-b" for="dual" class="t" style="left: 42px; top: 620px"
      >B</label
    >
    <input
      id="dual"
      type="checkbox"
      class="t"
      style="left: 100px; top: 623px; width: 13px; height: 13px"
    />

    <!-- Far below the initial viewport: exercises the scroll + hit-test path -->
    <button id="far" class="t" style="left: 20px; top: 2000px">f</button>

    <!-- position: fixed 44x44 button at viewport (121, 350). When #near-fixed
         (document (100, 1000), center (110, 1010)) is scrolled into view the
         fixed button's left edge is 11px from that center → intersects. -->
    <button
      id="fixed-btn"
      class="t"
      style="
        position: fixed;
        left: 121px;
        top: 350px;
        width: 44px;
        height: 44px;
      "
    >
      F
    </button>
    <button id="near-fixed" class="t" style="left: 100px; top: 1000px">
      x
    </button>

    <!-- position: fixed inside a transformed ancestor is NOT viewport-fixed: it
         scrolls with the page, so it is a normal flow neighbor at document
         (500, 100); #tflow at (500, 122) is 22px below → circles intersect. -->
    <div style="position: absolute; left: 0; top: 0; transform: translateZ(0)">
      <button
        id="tfixed"
        class="t"
        style="position: fixed; left: 500px; top: 100px"
      >
        t
      </button>
    </div>
    <button id="tflow" class="t" style="left: 500px; top: 122px">u</button>

    <!-- Undersized viewport-fixed button with no neighbor: verified, and its
         reported circle center must be in document coordinates. -->
    <button
      id="tiny-fixed"
      class="t"
      style="position: fixed; left: 600px; top: 300px"
    >
      v
    </button>
  </body>
</html>
