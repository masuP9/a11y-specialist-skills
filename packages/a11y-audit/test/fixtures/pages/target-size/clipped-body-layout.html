<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>target-size target clipped by a contained body's overflow</title>
    <style>
      /* Layout containment stops body's overflow from propagating to the
         viewport, so body itself clips its content to its 30px height. */
      body {
        margin: 0;
        font-family: sans-serif;
        height: 30px;
        contain: layout;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <pre
      id="long"
      tabindex="0"
      style="margin: 0; width: 300px; height: 2000px; background: #eee"
    >
code</pre>
  </body>
</html>
