<!doctype html>
<!--
  Focusing the select opens an alert (an On Focus behavior, 3.2.1). The change
  event has no handler.
  Expected: no findings; #trap is skipped with reason
  "context-change-on-focus"; the check does not hang.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dialog on focus</title>
  </head>
  <body>
    <label for="trap">Trap</label>
    <select id="trap" onfocus="alert('hi')">
      <option>A</option>
      <option>B</option>
    </select>
  </body>
</html>
