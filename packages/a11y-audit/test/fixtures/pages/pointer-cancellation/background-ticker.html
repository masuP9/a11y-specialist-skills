<!doctype html>
<!--
  A clock rewrites its text every 100ms. A button reacts to click only.
  Expected: domObservation 'ignored-background-activity', no findings; rule:
  incomplete (page node only).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Background ticker</title>
  </head>
  <body>
    <span id="clock">0</span>
    <button type="button" id="b">Button</button>
    <script>
      let count = 0;
      setInterval(() => {
        count += 1;
        document.getElementById('clock').textContent = String(count);
      }, 100);
      document.getElementById('b').addEventListener('click', () => {});
    </script>
  </body>
</html>
