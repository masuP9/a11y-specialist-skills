<!doctype html>
<!--
  A button opens a new window on mousedown.
  Expected: one activated-on-press finding whose changes include a new-window
  (landing.html). Rule: incomplete.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mousedown window.open</title>
  </head>
  <body>
    <button type="button" id="w">Open</button>
    <script>
      document.getElementById('w').addEventListener('mousedown', () => {
        window.open('landing.html');
      });
    </script>
  </body>
</html>
