<!doctype html>
<!--
  A button navigates 450ms after mousedown, later than the settleMs the test passes (300ms). The
  next button reacts to click only. 450ms lands in the middle of the next
  button's observation (about 310-620ms after this mousedown), so the
  navigation commits while #after is pressed. 600ms landed at the end of that
  window and sometimes committed after it, leaving no restart (#169).
  Expected: the late navigation is not reported as 'element-gone' for #after;
  nothing is untested; the check restarts and #after is tested.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Slow navigation</title>
  </head>
  <body>
    <button type="button" id="slow">Slow</button>
    <button type="button" id="after">After</button>
    <script>
      document.getElementById('slow').addEventListener('mousedown', () => {
        setTimeout(() => {
          location.href = 'landing.html';
        }, 450);
      });
      document.getElementById('after').addEventListener('click', () => {});
    </script>
  </body>
</html>
