<!doctype html>
<!--
  Intent: an ancestor of the header is position: sticky.
  Expected: icon-button status undetermined, reason out-of-flow; behindIndicators is empty.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>behind-sticky-ancestor</title>
    <style>
      body {
        margin: 0;
      }
      .header {
        position: absolute;
        top: 20px;
        left: 20px;
      }
      #menu {
        display: block;
        width: 48px;
        height: 48px;
        padding: 6px;
        border: 0;
        background: transparent;
      }
      .under {
        position: absolute;
        top: 0;
        left: 0;
        width: 200px;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <div style="position: sticky; top: 0">
      <div class="header">
        <button id="menu" aria-label="Menu">
          <svg width="36" height="36" viewBox="0 0 36 36">
            <rect x="6" y="6" width="24" height="24" fill="#767676" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
