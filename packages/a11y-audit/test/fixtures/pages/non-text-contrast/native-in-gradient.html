<!doctype html>
<!--
  Intent: a default native checkbox on a gradient background. A native control does not depend on the
  outer background color.
  Expected: status user-agent.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Native checkbox on a gradient</title>
  </head>
  <body>
    <div style="background: linear-gradient(#fff, #000)">
      <input type="checkbox" aria-label="Agree" />
    </div>
  </body>
</html>
