<!doctype html>
<!--
  Intent: one shape stops with out-of-flow, and a use element sets its own color.
  Expected: icon-button status undetermined, reason out-of-flow; behindIndicators is empty.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>behind-other-reason</title>
    <style>
      body {
        margin: 0;
      }
      .header {
        position: absolute;
        top: 20px;
        left: 20px;
      }
      #menu {
        display: block;
        width: 48px;
        height: 48px;
        padding: 6px;
        border: 0;
        background: transparent;
      }
      .under {
        position: absolute;
        top: 0;
        left: 0;
        width: 200px;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <button id="menu" aria-label="Menu">
        <svg width="36" height="36" viewBox="0 0 36 36">
          <defs><rect id="own" width="8" height="8" fill="#ff0000" /></defs>
          <rect x="20" y="20" width="8" height="8" fill="#767676" />
          <use href="#own" />
        </svg>
      </button>
    </div>
  </body>
</html>
