<!doctype html>
<!--
  Intent: a black button whose white SVG icon is position: absolute and drawn outside the button
  (top: -30px), on the white page.
  Expected: icon-button status undetermined, reason out-of-flow.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Absolutely positioned SVG icon</title>
  </head>
  <body>
    <button aria-label="Close" style="background: #000; border: 0">
      <svg
        viewBox="0 0 10 10"
        width="20"
        height="20"
        style="position: absolute; top: -30px"
      >
        <path d="M0 0L10 10" fill="none" stroke="#fff" stroke-width="2" />
      </svg>
    </button>
  </body>
</html>
