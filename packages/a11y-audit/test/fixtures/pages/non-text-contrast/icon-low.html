<!doctype html>
<!--
  Intent: an icon-only button whose SVG stroke (#bbb) is faint on a white button.
  Expected: icon-button status low; icon rule incomplete.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Faint icon</title>
  </head>
  <body>
    <button aria-label="Close" style="background: #fff; border: 0">
      <svg viewBox="0 0 10 10" width="20" height="20">
        <path d="M0 0L10 10" fill="none" stroke="#bbb" stroke-width="2" />
      </svg>
    </button>
  </body>
</html>
