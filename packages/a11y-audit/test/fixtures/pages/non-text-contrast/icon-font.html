<!doctype html>
<!--
  Intent: an icon-font style button: the icon is a ::before character colored #ddd on a white button.
  Expected: icon-button status low (the pseudo-element color is measured).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Icon font</title>
    <style>
      .i::before {
        content: '\2715';
        color: #ddd;
      }
    </style>
  </head>
  <body>
    <button aria-label="Search" style="background: #fff; border: 0">
      <span class="i"></span>
    </button>
  </body>
</html>
