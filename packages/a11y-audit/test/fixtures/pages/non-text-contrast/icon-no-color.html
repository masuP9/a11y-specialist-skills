<!doctype html>
<!--
  Intent: an icon button whose only SVG path has a transparent fill and no stroke, so no icon color exists.
  Expected: icon-button status undetermined, reason no-icon-color.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Icon without color</title>
  </head>
  <body>
    <button aria-label="Close" style="background: #fff; border: 0">
      <svg viewBox="0 0 10 10" width="20" height="20">
        <path d="M0 0h10v10z" fill="transparent" />
      </svg>
    </button>
  </body>
</html>
