<!doctype html>
<!--
  Intent: a text field whose border (#ccc) and fill (white) are close to the white page.
  Expected: status low, bestRatio 1.6; boundary rule incomplete.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Low contrast border</title>
  </head>
  <body>
    <input
      id="field"
      aria-label="Name"
      style="border: 1px solid #ccc; background: #fff"
    />
  </body>
</html>
