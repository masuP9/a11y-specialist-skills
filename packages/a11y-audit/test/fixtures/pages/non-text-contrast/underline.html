<!doctype html>
<!--
  Intent: a text field marked only by a #767676 bottom border.
  Expected: status pass; the only indicator is border-bottom.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Underline only</title>
  </head>
  <body>
    <input
      aria-label="Name"
      style="
        border: 0;
        border-bottom: 2px solid #767676;
        background: transparent;
      "
    />
  </body>
</html>
