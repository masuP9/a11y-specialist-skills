<!doctype html>
<!--
  Intent: text fields whose boundary is drawn only with box-shadow, on a white
  page. Each field has its own id; the tests look them up one by one.
  Expected: status stays no-boundary (box-shadow does not change status);
  otherIndicators / otherSkipped describe the shadow.
    #light-ring     #b2b2b2 1px ring            -> box-shadow 2.12:1
    #dark-ring      #767676 1px ring            -> box-shadow 4.54:1
    #offset-line    0 1px 0 0 #767676 (bottom)  -> box-shadow 4.54:1
    #translucent    rgba(0,0,0,.6) 1px ring     -> box-shadow 5.74:1 (composited)
    #tailwind-ring  transparent layers + ring   -> box-shadow 4.54:1
    #tailwind-only  transparent layers only     -> no box-shadow at all
    #blurred        0 0 4px 0 #000              -> skipped blurred-shadow
    #two-layers     white ring over black ring  -> skipped multiple-shadows
    #thin           0.5px ring                  -> skipped thin
    #clipped        ring inside overflow:hidden -> skipped clipped
    #inset-border   inset #767676 ring, 2px #eee border -> status low (border);
                    the ring is compared with the border (3.91:1)
    #positioned     position:absolute, dark ring -> undetermined out-of-flow, no shadow measured
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Box shadow boundaries</title>
    <style>
      body {
        background: #fff;
      }
      div {
        padding: 16px;
      }
      input {
        border: 0;
        background: transparent;
      }
      .clip {
        display: inline-block;
        overflow: hidden;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div>
      <input
        id="light-ring"
        aria-label="Light ring"
        style="box-shadow: 0 0 0 1px #b2b2b2"
      />
    </div>
    <div>
      <input
        id="dark-ring"
        aria-label="Dark ring"
        style="box-shadow: 0 0 0 1px #767676"
      />
    </div>
    <div>
      <input
        id="offset-line"
        aria-label="Offset line"
        style="box-shadow: 0 1px 0 0 #767676"
      />
    </div>
    <div>
      <input
        id="translucent"
        aria-label="Translucent ring"
        style="box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6)"
      />
    </div>
    <div>
      <input
        id="tailwind-ring"
        aria-label="Tailwind ring"
        style="
          box-shadow:
            0 0 #0000,
            0 0 #0000,
            0 0 0 1px #767676;
        "
      />
    </div>
    <div>
      <input
        id="tailwind-only"
        aria-label="Tailwind only"
        style="
          box-shadow:
            0 0 #0000,
            0 0 0 0 rgba(0, 0, 0, 0);
        "
      />
    </div>
    <div>
      <input
        id="blurred"
        aria-label="Blurred"
        style="box-shadow: 0 0 4px 0 #000"
      />
    </div>
    <div>
      <input
        id="two-layers"
        aria-label="Two layers"
        style="
          box-shadow:
            0 0 0 2px #fff,
            0 0 0 1px #000;
        "
      />
    </div>
    <div>
      <input id="thin" aria-label="Thin" style="box-shadow: 0 0 0 0.5px #000" />
    </div>
    <div>
      <span class="clip"
        ><input
          id="clipped"
          aria-label="Clipped"
          style="box-shadow: 0 0 0 2px #000"
      /></span>
    </div>
    <div>
      <input
        id="inset-border"
        aria-label="Inset with border"
        style="border: 2px solid #eee; box-shadow: inset 0 0 0 2px #767676"
      />
    </div>
    <div style="position: relative; height: 40px">
      <input
        id="positioned"
        aria-label="Positioned"
        style="position: absolute; top: 8px; box-shadow: 0 0 0 1px #767676"
      />
    </div>
  </body>
</html>
