<!doctype html>
<!--
  Intent: touchstart + touchmove on a canvas whose touchstart handler calls
  ctx.scale(); that is drawing, not a multi-finger gesture.
  Expected: candidate #board with move-listener but NOT multipoint-listener.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canvas scale</title>
  </head>
  <body>
    <canvas id="board" width="100" height="100"></canvas>
    <script>
      const board = document.getElementById('board');
      const ctx = board.getContext('2d');
      board.addEventListener('touchstart', () => {
        ctx.scale(2, 2);
      });
      board.addEventListener('touchmove', () => {});
    </script>
  </body>
</html>
