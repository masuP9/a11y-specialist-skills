<!doctype html>
<html lang="en">
  <!--
    Intent: row-reverse lays three buttons out right to left, so Tab moves left
    along one row.
    Expected: two transitions of kind 'backward-inline'; focus-order-visual is incomplete.
  -->
  <head>
    <meta charset="utf-8" />
    <title>Backward inline</title>
    <style>
      body {
        margin: 0;
        width: 1000px;
      }
      div {
        display: flex;
        flex-direction: row-reverse;
        width: 600px;
      }
      button {
        width: 100px;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <div>
      <button type="button">One</button>
      <button type="button">Two</button>
      <button type="button">Three</button>
    </div>
  </body>
</html>
