<!doctype html>
<html lang="en">
  <!--
    Intent: focus moves into the modal, Escape does nothing, and the Close button
    hides the dialog without returning focus to the opening button.
    Expected: closedBy 'close-button', focusAfterClose 'body'; focus-order-dialog
    is incomplete with one node whose summary contains 'instead of back to this control'.
  -->
  <head>
    <meta charset="utf-8" />
    <title>Dialog no return</title>
  </head>
  <body>
    <button id="open" type="button" data-bs-toggle="modal">Open</button>
    <div
      id="d"
      role="dialog"
      aria-modal="true"
      aria-label="Sample"
      style="display: none"
    >
      <p>Dialog body</p>
      <button id="close" type="button">Close</button>
    </div>
    <script>
      const d = document.getElementById('d');
      const close = document.getElementById('close');
      document.getElementById('open').addEventListener('click', () => {
        d.style.display = 'block';
        close.focus();
      });
      close.addEventListener('click', () => {
        d.style.display = 'none';
      });
    </script>
  </body>
</html>
