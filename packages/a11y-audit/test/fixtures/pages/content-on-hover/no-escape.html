<!doctype html>
<!--
  Same as compliant-tooltip.html but Escape is not handled.
  Expected: one trigger (#btn). Hover and focus results have dismissible
  "stayed"; persistent "stayed"; hover hoverable "stayed". Only the
  dismissible rule is incomplete, with the button as the node.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>No Escape</title>
    <style>
      .wrap {
        position: relative;
        display: inline-block;
      }
      .tip {
        position: absolute;
        top: 100%;
        left: 0;
        width: 140px;
        padding: 8px;
        background: #222;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <span id="wrap" class="wrap">
        <button id="btn" type="button">Info</button>
        <div id="tip" class="tip" role="tooltip" hidden>Helpful tip</div>
      </span>
    </main>
    <script>
      const btn = document.getElementById('btn');
      const tip = document.getElementById('tip');
      const show = () => {
        tip.hidden = false;
      };
      const hide = () => {
        tip.hidden = true;
      };
      btn.addEventListener('mouseenter', show);
      btn.addEventListener('focus', show);
      btn.addEventListener('blur', hide);
      document.getElementById('wrap').addEventListener('mouseleave', hide);
    </script>
  </body>
</html>
