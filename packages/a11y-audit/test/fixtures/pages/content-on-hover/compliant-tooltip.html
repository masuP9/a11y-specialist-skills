<!doctype html>
<!--
  A tooltip that meets 1.4.13: shown on hover and focus, dismissed with Escape,
  and the pointer can move from the button onto the tooltip (both sit inside
  one wrapper; the wrapper's mouseleave hides it).
  Expected: one trigger (#btn). Results: hover and focus, both persistent
  "stayed" and dismissible "dismissed" (focus not moved), hover hoverable
  "stayed". All three rules pass.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Compliant tooltip</title>
    <style>
      .wrap {
        position: relative;
        display: inline-block;
      }
      .tip {
        position: absolute;
        top: 100%;
        left: 0;
        width: 140px;
        padding: 8px;
        background: #222;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <span id="wrap" class="wrap">
        <button id="btn" type="button">Info</button>
        <div id="tip" class="tip" role="tooltip" hidden>Helpful tip</div>
      </span>
    </main>
    <script>
      const btn = document.getElementById('btn');
      const tip = document.getElementById('tip');
      const show = () => {
        tip.hidden = false;
      };
      const hide = () => {
        tip.hidden = true;
      };
      btn.addEventListener('mouseenter', show);
      btn.addEventListener('focus', show);
      btn.addEventListener('blur', hide);
      document.getElementById('wrap').addEventListener('mouseleave', hide);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') hide();
      });
    </script>
  </body>
</html>
