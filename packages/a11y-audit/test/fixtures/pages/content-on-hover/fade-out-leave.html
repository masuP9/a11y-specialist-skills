<!doctype html>
<!--
  The tooltip sits 8px away from the button. The button's mouseleave (and
  Escape) fade it out over 300ms with a CSS opacity transition, then hide it
  on transitionend. Blur hides it at once.
  Expected: one trigger (#btn). Hover result: persistent "stayed",
  dismissible "dismissed", hoverable "disappeared". Measured: a fixed
  200ms wait still gives "disappeared" (the 10-step pointer move and the
  evaluate round trip add over 100ms); a fixed 100ms wait gives "stayed".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fade out on leave</title>
    <style>
      .wrap {
        position: relative;
        display: inline-block;
      }
      .tip {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        width: 140px;
        padding: 8px;
        background: #222;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="wrap">
        <button id="btn" type="button">Info</button>
        <div id="tip" class="tip" role="tooltip" hidden>Helpful tip</div>
      </span>
    </main>
    <script>
      const btn = document.getElementById('btn');
      const tip = document.getElementById('tip');
      const show = () => {
        tip.style.transition = 'none';
        tip.style.opacity = '1';
        tip.hidden = false;
      };
      const hide = () => {
        tip.hidden = true;
      };
      const fadeOut = () => {
        tip.style.transition = 'opacity 300ms';
        void tip.offsetWidth;
        tip.style.opacity = '0';
      };
      tip.addEventListener('transitionend', hide);
      btn.addEventListener('mouseenter', show);
      btn.addEventListener('focus', show);
      btn.addEventListener('mouseleave', fadeOut);
      btn.addEventListener('blur', hide);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') fadeOut();
      });
    </script>
  </body>
</html>
