name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'scripts/validate-skills.mjs'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.agents/plugins/**'
      - 'skills/auditing-wcag/references/scripts/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'scripts/validate-skills.mjs'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.agents/plugins/**'
      - 'skills/auditing-wcag/references/scripts/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  skill-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Claude Code and Codex skills
        run: npm run validate:skills

      - name: Test compatibility validator
        run: npm run test:validator

  a11y-audit-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build --workspace @a11y-skills/audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/a11y-audit

      - name: Run smoke tests
        run: npm test --workspace @a11y-skills/audit

      - name: Verify publish payload
        run: npm publish --workspace @a11y-skills/audit --dry-run

  wcag-audit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/auditing-wcag/references/scripts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: skills/auditing-wcag/references/scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (wrappers resolve @a11y-skills/audit)
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wcag-audit-results
          path: |
            skills/auditing-wcag/references/scripts/*-result.json
            skills/auditing-wcag/references/scripts/*-screenshot*.png
            skills/auditing-wcag/references/scripts/focus-indicators.png
          retention-days: 7
