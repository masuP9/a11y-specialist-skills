name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'scripts/validate-skills.mjs'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.agents/plugins/**'
      - 'skills/auditing-wcag/references/scripts/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ci.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
  pull_request:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'scripts/validate-skills.mjs'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.agents/plugins/**'
      - 'skills/auditing-wcag/references/scripts/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ci.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
  workflow_dispatch:

jobs:
  skill-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Claude Code and Codex skills
        run: npm run validate:skills

      - name: Test compatibility validator
        run: npm run test:validator

  a11y-audit-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check
        run: |
          npm run lint
          npm run format:check

      - name: Type-check & build
        run: npm run build --workspace @a11y-skills/audit

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: packages/a11y-audit

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: packages/a11y-audit

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: packages/a11y-audit

      - name: Run smoke tests
        run: npm test --workspace @a11y-skills/audit

      - name: CLI smoke test (all checks)
        run: |
          set +e
          node packages/a11y-audit/dist/cli.js \
            --url "file://$PWD/packages/a11y-audit/test/fixtures/cli-smoke.html" \
            --checks all --output-dir /tmp/cli-smoke | tee /tmp/cli-smoke-stdout.log
          code="${PIPESTATUS[0]}"
          set -e
          test "$code" -eq 1
          grep -E "Errors: +0" /tmp/cli-smoke-stdout.log
          test -n "$(ls /tmp/cli-smoke/)"

      - name: Verify publish payload
        # `npm pack` lists the tarball contents without the registry version
        # check that `npm publish --dry-run` performs on npm 11+ (which fails
        # between a release and the next version bump).
        run: npm pack --workspace @a11y-skills/audit --dry-run

  wcag-audit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/auditing-wcag/references/scripts

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: skills/auditing-wcag/references/scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (wrappers resolve @a11y-skills/audit)
        run: npm run typecheck

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wcag-audit-results
          path: |
            skills/auditing-wcag/references/scripts/*-result.json
            skills/auditing-wcag/references/scripts/*-screenshot*.png
            skills/auditing-wcag/references/scripts/focus-indicators.png
          retention-days: 7
