name: Release a11y-audit

# Publishes @a11y-skills/audit to npm when a tag like `a11y-audit-v0.1.0` is
# pushed. Authentication uses npm Trusted Publishing (OIDC) — no `NPM_TOKEN`
# secret is needed. The package on npmjs.com must have a Trusted Publisher
# configured for this repo with workflow filename `release.yml` and the
# `npm publish` action allowed. See https://docs.npmjs.com/trusted-publishers
on:
  push:
    tags:
      - 'a11y-audit-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token exchange for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # OIDC trusted publishing needs Node >= 22.14.0
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#a11y-audit-v}"
          PKG_VERSION=$(node -p "require('./packages/a11y-audit/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace @a11y-skills/audit

      - name: Publish (dry-run on workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --workspace @a11y-skills/audit --access public --dry-run

      # Idempotent: skip publishing a version that is already on npm (e.g. when
      # a tag is pushed for a version that was published manually). Only treat a
      # genuine 404 as "not published"; fail loudly on any other npm view error.
      - name: Check if version already published
        id: published
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./packages/a11y-audit/package.json').version")
          if out=$(npm view "@a11y-skills/audit@$VERSION" version 2>&1); then
            if [ "$out" = "$VERSION" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "@a11y-skills/audit@$VERSION is already published; skipping publish."
            else
              echo "::error::unexpected npm view output: $out"; exit 1
            fi
          elif grep -q 'E404' <<<"$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view failed for a non-404 reason:"; printf '%s\n' "$out"; exit 1
          fi

      - name: Publish to npm
        if: github.event_name == 'push' && steps.published.outputs.exists != 'true'
        run: npm publish --workspace @a11y-skills/audit --access public --provenance

  # After a successful tag-push publish, open a PR bumping the auditing-wcag
  # wrapper scripts to the just-released version. Idempotent: skips when the
  # wrapper is already on that version.
  bump-wrapper:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Wait for npm registry propagation
        run: |
          VERSION="${GITHUB_REF_NAME#a11y-audit-v}"
          for i in $(seq 1 10); do
            if [ "$(npm view "@a11y-skills/audit@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "@a11y-skills/audit@$VERSION is visible on npm."
              exit 0
            fi
            echo "Not visible yet, retry $i/10..."
            sleep 15
          done
          echo "::error::@a11y-skills/audit@$VERSION not visible on npm after 150s"
          exit 1

      - name: Bump wrapper dependency and lockfile
        working-directory: skills/auditing-wcag/references/scripts
        run: |
          VERSION="${GITHUB_REF_NAME#a11y-audit-v}"
          CURRENT=$(node -p "require('./package.json').dependencies['@a11y-skills/audit']")
          if [ "$CURRENT" = "^$VERSION" ]; then
            echo "Wrapper already on ^$VERSION; nothing to do."
            echo "SKIP_PR=true" >> "$GITHUB_ENV"
            exit 0
          fi
          npm pkg set "dependencies.@a11y-skills/audit=^$VERSION"
          npm install --package-lock-only

      - name: Open bump PR
        if: env.SKIP_PR != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#a11y-audit-v}"
          BRANCH="chore/scripts-bump-audit-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add skills/auditing-wcag/references/scripts/package.json \
                  skills/auditing-wcag/references/scripts/package-lock.json
          git commit -m "chore(auditing-wcag): bump scripts to @a11y-skills/audit ^$VERSION"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(auditing-wcag): bump scripts to @a11y-skills/audit ^$VERSION" \
            --body "Automated follow-up to the \`a11y-audit-v$VERSION\` release: points the auditing-wcag wrapper scripts at the just-published package version.

Note: PRs created with GITHUB_TOKEN do not trigger CI automatically — close/reopen this PR (or push an empty commit) to run CI before merging." \
            --base main \
            --head "$BRANCH"
